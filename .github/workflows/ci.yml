name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # SQLite's C for wasm32 (sqlite-wasm-rs, under seaquel-storage and the
  # demo's module) needs a clang with the wasm32 backend and LLVM's archiver:
  # the runner's GNU `ar` makes archives wasm-ld rejects. ubuntu-latest
  # (24.04) has clang 16-18; clang-18 comes with llvm-18's llvm-ar-18.
  # scripts/build-wasm.mjs checks both run before it builds.
  CC_wasm32_unknown_unknown: clang-18
  AR_wasm32_unknown_unknown: llvm-ar-18

jobs:
  rust:
    name: Rust (lint, tests, wasm, crate rules, generated types)
    runs-on: ubuntu-latest
    # A cancel regression in the DuckDB live tests would otherwise leave a
    # query running until GitHub's 6-hour limit. Generous for a cold cache
    # (bundled DuckDB takes a while to compile).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # seaquel-secrets uses keyring's sync-secret-service, which links the
      # system libdbus through libdbus-sys (not vendored: the features match
      # what tauri-plugin-keyring resolved).
      - name: D-Bus headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Crate dependency rules
        run: node scripts/check-crate-deps.mjs

      - name: Rustfmt
        run: cargo fmt --all --check

      # Core's assistant and its tests (phase 6: tests/ai_turn.rs,
      # tests/ai_replay.rs) are on here because seaquel-server enables
      # `seaquel-core/ai-native` and the workspace build unifies it.
      - name: Clippy
        run: cargo clippy --workspace --exclude seaquel --all-targets --features seaquel-runtime/tokio -- -D warnings

      - name: Tests
        run: cargo test --workspace --exclude seaquel --features seaquel-runtime/tokio

      # The interface binaries as they ship, each with only its own features.
      # The steps above build the whole workspace, where Cargo unifies every
      # crate's features (src-tauri's `git` included), so a cfg gate that's
      # wrong for one interface's set compiles there anyway: 5e's
      # `connection_order_in` broke `npm run cli:build` (Core with `imports`
      # and without `git`) and nothing else. One `-p` per invocation: the
      # resolver unifies features across every package named in one command.
      # Lib and bins only, no `--all-targets`, so no dev-dependency adds a
      # feature. Clippy rather than check: same cost, and dead code under one
      # set fails too. Same target dir, so dependencies whose features match
      # are reused.
      - name: Interfaces build on their own features
        run: |
          cargo clippy -p seaquel-cli -- -D warnings
          cargo clippy -p seaquel-server -- -D warnings
          cargo clippy -p seaquel-mcp -- -D warnings
          cargo clippy -p seaquel-terminal -- -D warnings
          cargo clippy -p seaquel-tui -- -D warnings

      # Phase 7a, Decisions 2 and 22: each terminal binary links only its own
      # extras. The TUI has no MCP server (rmcp), git, imports (plist) or
      # license client; the CLI has no model HTTP client (reqwest, which only
      # `ai-native` brings). Normal dependencies, as each binary builds.
      - name: Terminal binaries' dependencies
        shell: bash
        run: |
          set -euo pipefail
          # One list per binary, built the same way; a failing `cargo tree`
          # fails the step (pipefail, and `set -e` on the assignment).
          deps() { cargo tree -p "$1" -e normal --prefix none | sed 's/ .*//' | sort -u; }
          tui=$(deps seaquel-tui)
          cli=$(deps seaquel-cli)
          test -n "$tui" && test -n "$cli"
          found=0
          for name in rmcp git2 libgit2-sys plist seaquel-mcp seaquel-rpc seaquel-license; do
            if grep -qx -- "$name" <<<"$tui"; then
              echo "::error::seaquel-tui depends on $name"
              found=1
            fi
          done
          for name in reqwest; do
            if grep -qx -- "$name" <<<"$cli"; then
              echo "::error::seaquel-cli depends on $name"
              found=1
            fi
          done
          exit "$found"

      - name: Pure crates build for wasm32
        run: cargo clippy --target wasm32-unknown-unknown -p seaquel-types -p seaquel-runtime -p seaquel-engine -p seaquel-sql -p seaquel-wasm -- -D warnings

      # Phase 6: the AI domain crate builds for wasm32 (the demo's module
      # links it in Task 8). No tokio, reqwest or clock; its `testing`
      # feature (the mock provider) is native-only and stays off here.
      - name: seaquel-ai builds for wasm32
        run: cargo clippy --target wasm32-unknown-unknown -p seaquel-ai -- -D warnings

      # Phase 8 Decision 14: the crates the demo's module links, built for
      # wasm32 as the module uses them. Core's `browser` admits `storage`
      # and `workspace` and still refuses every engine (`engine-duckdb` is
      # the native driver), secrets, SSH, git, licensing and the imports;
      # the bare `browser` set is checked too, and (phase 6) the set with
      # the assistant (`ai`, without the native client). The module registers
      # DuckDB's browser driver itself, so that crate has its own line.
      # seaquel-storage compiles SQLite's C for wasm32 through sqlite-wasm-rs,
      # with the clang and llvm-ar set in the workflow's `env`.
      - name: Core builds for wasm32 (browser)
        run: |
          cargo clippy --target wasm32-unknown-unknown -p seaquel-core -p seaquel-rpc --no-default-features --features seaquel-core/browser -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p seaquel-core -p seaquel-rpc --no-default-features --features seaquel-core/browser,seaquel-core/storage,seaquel-core/workspace,seaquel-rpc/storage,seaquel-rpc/workspace -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p seaquel-core -p seaquel-rpc --no-default-features --features seaquel-core/browser,seaquel-core/storage,seaquel-core/workspace,seaquel-core/ai,seaquel-rpc/storage,seaquel-rpc/workspace,seaquel-rpc/ai -- -D warnings

      - name: Storage builds for wasm32
        run: cargo clippy --target wasm32-unknown-unknown -p seaquel-storage --all-targets -- -D warnings

      # Phase 8 Task 2: the browser storage's tests (the wrapper's unit tests
      # and tests/wasm.rs) run in wasm32 under Node (set up above) through
      # wasm-bindgen-test-runner, which comes with wasm-bindgen-cli at
      # Cargo.lock's version, installed as the frontend job does.
      - name: wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: echo "version=$(node scripts/build-wasm.mjs --bindgen-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Storage tests in wasm32
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --target wasm32-unknown-unknown -p seaquel-storage --all-targets

      - name: DuckDB's browser driver builds for wasm32
        run: cargo clippy --target wasm32-unknown-unknown -p seaquel-engine-duckdb --no-default-features --features seaquel-engine-duckdb/browser -- -D warnings

      # The demo's module (phase 8, Task 5), as the demo ships it and with the
      # test exports vitest uses.
      - name: The browser module builds for wasm32
        run: |
          cargo clippy --target wasm32-unknown-unknown -p seaquel-browser -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p seaquel-browser --features seaquel-browser/test-hooks -- -D warnings

      # Decisions 11 and 11b: the web server (and so the Docker image) builds
      # without the SQLite and DuckDB engines, libgit2, russh, keyring or
      # OpenSSL. sqlx's own SQLite (libsqlite3-sys) stays: it's the storage
      # for meta.db and auth.db, not the engine. Normal dependencies only, as
      # `cargo build -p seaquel-server` resolves them.
      - name: Web server dependencies
        run: |
          deps=$(cargo tree -p seaquel-server -e normal --prefix none | sed 's/ .*//' | sort -u)
          # Substrings, so a renamed or -sys crate (libduckdb-sys,
          # libgit2-sys, openssl-sys, libdbus-sys, ...) is caught too.
          # openssl-probe is allowed: pure Rust with no dependencies, it only
          # looks for the system CA bundle's path (rustls-native-certs on
          # Linux, through tiberius and reqwest) and links no OpenSSL.
          # Phase 8 Decision 22: nor the browser module's SQLite, Arrow IPC
          # reader or wasm-bindgen.
          banned=$(echo "$deps" | grep -E '(duckdb|git2|russh|openssl|native-tls|keyring|dbus|libssh2|seaquel-engine-(sqlite|duckdb)|seaquel-(ssh|git|secrets)|sqlite-wasm-rs|arrow-ipc|wasm-bindgen)' | grep -vx 'openssl-probe' || true)
          if [ -n "$banned" ]; then
            echo "::error::seaquel-server depends on: $banned"
            exit 1
          fi

      - name: Generated TypeScript types are up to date
        run: |
          npm run types:gen
          if [ -n "$(git status --porcelain -- src/lib/types/generated)" ]; then
            git status --porcelain -- src/lib/types/generated
            echo "::error::src/lib/types/generated is stale. Run 'npm run types:gen' and commit the result."
            exit 1
          fi

  # Every test target of the engine crates (unit tests, including MSSQL's
  # live_tests; smoke; live; values; row_cap; the parity tests) against real
  # servers. SEAQUEL_TEST_REQUIRE_ENGINES turns a missing SEAQUEL_TEST_* (or
  # a missing seeded DuckDB file) into a failure instead of a silent skip.
  engines:
    name: Engine tests (live servers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: seaquel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: seaquel_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: seaquel_test
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Seaquel_Test_123!
          MSSQL_PID: Developer
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Seaquel_Test_123! -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 10s --health-retries 30 --health-start-period 30s
    env:
      SEAQUEL_TEST_REQUIRE_ENGINES: "1"
      SEAQUEL_TEST_POSTGRES: '{"driver":"postgres","connection_string":"postgres://postgres@127.0.0.1:5432/seaquel_test"}'
      SEAQUEL_TEST_MYSQL: '{"driver":"mysql","connection_string":"mysql://root@127.0.0.1:3306/seaquel_test"}'
      SEAQUEL_TEST_MARIADB: '{"driver":"mysql","connection_string":"mysql://root@127.0.0.1:3307/seaquel_test"}'
      SEAQUEL_TEST_MSSQL: '{"driver":"mssql","host":"127.0.0.1","port":1433,"username":"sa","password":"Seaquel_Test_123!","encrypt":true,"trust_cert":true}'
      # The SSH bastion started below reaches the postgres service by its
      # name on the services' network.
      SEAQUEL_TEST_SSH: '{"host":"127.0.0.1","port":2222,"remote_host":"postgres","remote_port":5432}'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The `ssh` service of e2e/test-databases/docker-compose.yml. It isn't a
      # service container because it mounts the fixture keys and init script
      # from the checkout; it joins the services' network to reach postgres.
      - name: SSH test server
        run: |
          docker run -d --name seaquel-ssh \
            --network "${{ job.services.postgres.network }}" \
            -p 127.0.0.1:2222:2222 \
            -e PUID=1000 -e PGID=1000 \
            -e USER_NAME=seaquel -e USER_PASSWORD=seaquel-test-password -e PASSWORD_ACCESS=true \
            -v "$GITHUB_WORKSPACE/e2e/test-databases/ssh/init:/custom-cont-init.d:ro" \
            -v "$GITHUB_WORKSPACE/e2e/test-databases/ssh:/seaquel-keys:ro" \
            lscr.io/linuxserver/openssh-server:10.2_p1-r0-ls216
          for i in $(seq 1 60); do
            # Ready once sshd answers with its host keys (after the init script).
            if ssh-keyscan -T 2 -p 2222 127.0.0.1 2>/dev/null | grep -q ssh-; then
              exit 0
            fi
            sleep 1
          done
          docker logs seaquel-ssh
          exit 1
      # The compose file's `blackhole`: accepts on 5432 and never answers, for
      # Core's `a_dropped_connect_closes_its_tunnel` (a database that hangs
      # behind a working tunnel). The bastion reaches it by that name.
      - name: Blackhole server
        run: |
          docker run -d --name seaquel-blackhole \
            --network "${{ job.services.postgres.network }}" --network-alias blackhole \
            alpine/socat:1.8.0.3 TCP-LISTEN:5432,fork,reuseaddr "SYSTEM:sleep 3600"
      # seaquel-core's tests build seaquel-secrets (keyring links libdbus).
      - name: D-Bus headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      # Same as `npm run e2e:db:seed`. It creates seaquel_test where the
      # service didn't (SQL Server has no env var for it) and loads the shared
      # fixtures (users, orders, ...) that the live tests read, e.g. the MySQL
      # EXPLAIN tests. The DuckDB tests run on a copy of the seeded
      # e2e/test-databases/duckdb/seaquel_test.duckdb (gitignored). The
      # seeders need only pg, mysql2, mssql and @duckdb/node-api.
      - run: npm ci --ignore-scripts
      - name: Seed the test databases
        run: node e2e/test-databases/seed.mjs postgresql mysql mariadb sqlserver duckdb
      - name: Engine tests
        run: >-
          cargo test
          -p seaquel-engine-postgres -p seaquel-engine-mysql -p seaquel-engine-mssql
          -p seaquel-engine-sqlite -p seaquel-engine-duckdb
          -p seaquel-ssh
      - name: SSH tunnels through Core
        run: cargo test -p seaquel-core --test ssh --test connect

  desktop:
    name: Desktop app compiles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Placeholder frontend
        # tauri::generate_context! requires frontendDist (../build) to exist.
        run: mkdir -p build && touch build/index.html
      - run: cargo check -p seaquel

  frontend:
    name: Frontend (types, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # `npm run check` regenerates the wire types with cargo first, and every
      # step below needs seaquel-wasm (src/lib/wasm/pkg, built on demand).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # types:gen runs seaquel-rpc's tests, whose seaquel-core dev-dependency
      # builds seaquel-secrets (keyring links libdbus).
      - name: D-Bus headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - run: npm ci
      - name: wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: echo "version=$(node scripts/build-wasm.mjs --bindgen-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - run: npm run wasm:build
      # The demo's module with its test exports, for vitest's browser-module
      # suites (src/lib/core/browser, src/lib/engine), which fail under CI
      # without it. `npm run build:demo` below builds the shipping module.
      - run: npm run wasm:build:browser-test
      - name: Compile paraglide messages
        # Normally generated by the Vite plugin; svelte-check imports them.
        run: npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide --strategy localStorage cookie globalVariable baseLocale
      - run: npm run check
      - name: Lint
        run: npx oxlint --type-aware --type-check --deny-warnings
      - run: npx vitest run
      # The cheapest target that loads the .wasm through a `?url` import under
      # a base path (/demo).
      - run: npm run build:demo
