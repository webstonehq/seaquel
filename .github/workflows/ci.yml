name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (lint, tests, wasm, crate rules, generated types)
    runs-on: ubuntu-latest
    # A cancel regression in the DuckDB live tests would otherwise leave a
    # query running until GitHub's 6-hour limit. Generous for a cold cache
    # (bundled DuckDB takes a while to compile).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Crate dependency rules
        run: node scripts/check-crate-deps.mjs

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude seaquel --all-targets --features seaquel-runtime/tokio -- -D warnings

      - name: Tests
        run: cargo test --workspace --exclude seaquel --features seaquel-runtime/tokio

      - name: Pure crates build for wasm32
        run: cargo clippy --target wasm32-unknown-unknown -p seaquel-types -p seaquel-runtime -p seaquel-engine -p seaquel-sql -p seaquel-wasm -- -D warnings

      - name: Generated TypeScript types are up to date
        run: |
          npm run types:gen
          if [ -n "$(git status --porcelain -- src/lib/types/generated)" ]; then
            git status --porcelain -- src/lib/types/generated
            echo "::error::src/lib/types/generated is stale. Run 'npm run types:gen' and commit the result."
            exit 1
          fi

  # Every test target of the engine crates (unit tests, including MSSQL's
  # live_tests; smoke; live; values; row_cap; the parity tests) against real
  # servers. SEAQUEL_TEST_REQUIRE_ENGINES turns a missing SEAQUEL_TEST_* (or
  # a missing seeded DuckDB file) into a failure instead of a silent skip.
  engines:
    name: Engine tests (live servers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: seaquel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: seaquel_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: seaquel_test
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Seaquel_Test_123!
          MSSQL_PID: Developer
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Seaquel_Test_123! -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 10s --health-retries 30 --health-start-period 30s
    env:
      SEAQUEL_TEST_REQUIRE_ENGINES: "1"
      SEAQUEL_TEST_POSTGRES: '{"driver":"postgres","connection_string":"postgres://postgres@127.0.0.1:5432/seaquel_test"}'
      SEAQUEL_TEST_MYSQL: '{"driver":"mysql","connection_string":"mysql://root@127.0.0.1:3306/seaquel_test"}'
      SEAQUEL_TEST_MARIADB: '{"driver":"mysql","connection_string":"mysql://root@127.0.0.1:3307/seaquel_test"}'
      SEAQUEL_TEST_MSSQL: '{"driver":"mssql","host":"127.0.0.1","port":1433,"username":"sa","password":"Seaquel_Test_123!","encrypt":true,"trust_cert":true}'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Same as `npm run e2e:db:seed`. It creates seaquel_test where the
      # service didn't (SQL Server has no env var for it) and loads the shared
      # fixtures (users, orders, ...) that the live tests read, e.g. the MySQL
      # EXPLAIN tests. The DuckDB tests run on a copy of the seeded
      # e2e/test-databases/duckdb/seaquel_test.duckdb (gitignored). The
      # seeders need only pg, mysql2, mssql and @duckdb/node-api.
      - run: npm ci --ignore-scripts
      - name: Seed the test databases
        run: node e2e/test-databases/seed.mjs postgresql mysql mariadb sqlserver duckdb
      - name: Engine tests
        run: >-
          cargo test
          -p seaquel-engine-postgres -p seaquel-engine-mysql -p seaquel-engine-mssql
          -p seaquel-engine-sqlite -p seaquel-engine-duckdb

  desktop:
    name: Desktop app compiles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Placeholder frontend
        # tauri::generate_context! requires frontendDist (../build) to exist.
        run: mkdir -p build && touch build/index.html
      - run: cargo check -p seaquel

  frontend:
    name: Frontend (types, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # `npm run check` regenerates the wire types with cargo first, and every
      # step below needs seaquel-wasm (src/lib/wasm/pkg, built on demand).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: echo "version=$(node scripts/build-wasm.mjs --bindgen-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - run: npm run wasm:build
      - name: Compile paraglide messages
        # Normally generated by the Vite plugin; svelte-check imports them.
        run: npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide --strategy localStorage cookie globalVariable baseLocale
      - run: npm run check
      - name: Lint
        run: npx oxlint --type-aware --type-check --deny-warnings
      - run: npx vitest run
      # The cheapest target that loads the .wasm through a `?url` import under
      # a base path (/demo).
      - run: npm run build:demo
