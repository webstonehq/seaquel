[package]
name = "seaquel"
version = "2026.10.0-beta.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "seaquel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The desktop's workspace (storage, the keychain), SSH tunnels,
# git for shared projects and the license client, besides every engine.
# `imports` (phase 5e): Core reads TablePlus's and DBeaver's files (it
# decodes the plist; `read_tableplus_config` and `plist` left this crate).
# `workspace`/`connect` (phase 5a): `db.connect` and `db.test` through the
# workspace, saved rows and forms alike.
# `ai-native` (phase 6): Core runs the assistant and calls models with
# seaquel-http's client; `ai-system-proxy` adds the OS proxy settings to it.
# `duckdb-helper-install`: Core's install of
# the `seaquel-duckdb` helper, into the folder the terminal binaries look
# in, with the remote DuckDB client (`engine-duckdb-remote`).
# No default features: the
# four engines that run in process, and DuckDB through the helper, so the
# app links no DuckDB (`libduckdb-sys`).
seaquel-core = { path = "../crates/seaquel-core", default-features = false, features = ["engine-postgres", "engine-mysql", "engine-sqlite", "engine-mssql", "storage", "secrets", "license-desktop", "git", "ssh", "workspace", "imports", "ai-native", "ai-system-proxy", "duckdb-helper-install"] }
seaquel-types = { path = "../crates/seaquel-types" }
# `TokioExecutor`, Core's clock for the editor's runs (phase 5b).
seaquel-runtime = { path = "../crates/seaquel-runtime", features = ["tokio"] }
seaquel-rpc = { path = "../crates/seaquel-rpc", features = ["storage", "secrets", "license-desktop", "git", "ssh", "workspace", "imports", "ai"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
time = { version = "0.3", features = ["formatting"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
futures = "0.3"
# OnceCell for the lazily opened workspace. SSH moved to seaquel-ssh.
# `time`: the bound on a stopped turn's last write (phase 6).
# `rt`: the helper install's own runtime (cli_download.rs).
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2.3.2"
arboard = "3.6.1"
image = "0.25.9"
dirs = { workspace = true }
opener = "0.7"
whoami = "1"
# The scratch dir of the stand-in workspace `db` calls use when storage
# can't open (DesktopWorkspace::db).
tempfile = "3"
reqwest = { workspace = true, features = ["blocking"] }
sha2 = "0.10"
tauri-plugin-deep-link = "2"
tauri-plugin-log = "2"
log = { version = "0.4", features = ["kv"] }
# The type of `PackageInfo::version` (tauri doesn't re-export it): a
# pre-release build follows the beta update channel (update_channel.rs).
semver = "1"

[dev-dependencies]
# The assistant's tests: the mock provider and the loopback-only client.
seaquel-ai = { path = "../crates/seaquel-ai", features = ["testing"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
# The DuckDB helper's install (cli_download.rs): `MockReleases` on
# 127.0.0.1 and the platform triple table. Never the real network.
seaquel-http = { path = "../crates/seaquel-http", features = ["release-asset", "testing"] }
# `CoreBuilder::duckdb_helper_releases` (the tests' loopback release
# server) outside debug builds, so `cargo test --release -p seaquel`
# compiles. Dev-dependency features reach test builds only:
# the app's own build still fetches only from GitHub.
seaquel-core = { path = "../crates/seaquel-core", default-features = false, features = ["duckdb-helper-testing"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
