[package]
name = "seaquel"
version = "2026.9.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "seaquel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Decision 11: the desktop's workspace (storage, the keychain), SSH tunnels,
# git for shared projects and the license client, besides every engine.
# `workspace`/`connect` (phase 5a): `db.connect` and `db.test` through the
# workspace, saved rows and forms alike.
seaquel-core = { path = "../crates/seaquel-core", features = ["storage", "secrets", "license-desktop", "git", "ssh", "workspace"] }
seaquel-types = { path = "../crates/seaquel-types" }
# `TokioExecutor`, Core's clock for the editor's runs (phase 5b).
seaquel-runtime = { path = "../crates/seaquel-runtime", features = ["tokio"] }
seaquel-rpc = { path = "../crates/seaquel-rpc", features = ["storage", "secrets", "license-desktop", "git", "ssh", "workspace"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
futures = "0.3"
# OnceCell for the lazily opened workspace. SSH moved to seaquel-ssh.
tokio = { version = "1", features = ["sync"] }
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2.3.2"
arboard = "3.6.1"
image = "0.25.9"
dirs = { workspace = true }
opener = "0.7"
whoami = "1"
plist = "1"
# The scratch dir of the stand-in workspace `db` calls use when storage
# can't open (DesktopWorkspace::db).
tempfile = "3"
reqwest = { workspace = true, features = ["blocking"] }
sha2 = "0.10"
tauri-plugin-deep-link = "2"
tauri-plugin-log = "2"
log = { version = "0.4", features = ["kv"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
