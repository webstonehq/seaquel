[package]
name = "seaquel-server"
version = "0.1.0"
edition = "2021"
description = "HTTP tenant-plane server for Seaquel. Serves the SvelteKit frontend and each user's workspace over /rpc and the /rpc/stream WebSocket."

[lib]
name = "seaquel_server"
path = "src/lib.rs"

[[bin]]
name = "seaquel-server"
path = "src/main.rs"

[dependencies]
# `storage` (Decision 11): each user's workspace opens their meta.db. No
# `secrets`: the web workspace has no store, so secret calls answer
# NOT_SUPPORTED. `license-server`: /internal/license/* over auth.db.
# Engines (Decision 11b): no SQLite and no DuckDB. Both open files on the
# server (auth.db, other users' meta.db, anything DuckDB's read_* or COPY TO
# reaches), so they're off on web. Feature unification can still compile them
# in (a workspace test build), so `AppState` also registers only
# `WEB_ENGINES`. storage and license-server keep sqlx's own SQLite for
# meta.db and auth.db; that isn't the engine.
seaquel-core = { path = "../seaquel-core", default-features = false, features = [
    "engine-postgres",
    "engine-mysql",
    "engine-mssql",
    "storage",
    "license-server",
] }
seaquel-types = { path = "../seaquel-types" }
seaquel-rpc = { path = "../seaquel-rpc", features = ["storage", "workspace"] }
# `TokioExecutor`, Core's clock for the editor's runs (phase 5b).
seaquel-runtime = { path = "../seaquel-runtime", features = ["tokio"] }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true, features = ["full"] }

serde = { workspace = true }
# raw_value: /rpc/stream hands a frame's `request` to parse_request as its
# exact text.
serde_json = { workspace = true, features = ["raw_value"] }
log = { workspace = true }
futures = { workspace = true }
# web_config: reads connection URLs the way sqlx does (same crate).
url = "2"

# Frontend asset embedding. In release builds, files are baked into the
# binary; in debug builds, rust-embed loads them from disk at runtime so
# `npm run build:web` doesn't require a Rust recompile during development.
rust-embed = "8"
mime_guess = "2"

[target.'cfg(unix)'.dependencies]
# getrlimit/setrlimit: main raises the open-files limit for the workspace
# pools.
libc = "0.2"

[dev-dependencies]
# tests/rpc_shared.rs: the server's Core refuses the `shared` and `imports`
# groups (no `LocalFiles`) with Core's `git` and `imports` compiled in, as
# a workspace test build's feature unification does. Dev only: the "Web
# server dependencies" CI step reads the normal dependencies, which keep
# neither git2 nor plist.
seaquel-rpc = { path = "../seaquel-rpc", features = ["storage", "workspace", "git", "imports"] }
# The /rpc and /rpc/stream tests' fake "postgres" engine (`tests/common`):
# the real Postgres dialect, no database behind it.
seaquel-engine = { path = "../seaquel-engine" }
seaquel-engine-postgres = { path = "../seaquel-engine-postgres" }
seaquel-runtime = { path = "../seaquel-runtime" }
http-body-util = { workspace = true }
tokio-tungstenite = "0.24"
tempfile = "3"
# The license route tests build auth.db from Node's migrations and sign
# bundles.
sqlx = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
sha2 = "0.10"
