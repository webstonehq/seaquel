[package]
name = "seaquel-server"
version = "0.1.0"
edition = "2021"
description = "HTTP tenant-plane server for Seaquel. Serves the SvelteKit frontend and exposes DB operations over HTTP + WebSocket."

[lib]
name = "seaquel_server"
path = "src/lib.rs"

[[bin]]
name = "seaquel-server"
path = "src/main.rs"

[dependencies]
seaquel-db = { path = "../seaquel-db" }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true, features = ["full"] }

serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

# Frontend asset embedding. In release builds, files are baked into the
# binary; in debug builds, rust-embed loads them from disk at runtime so
# `npm run build:web` doesn't require a Rust recompile during development.
rust-embed = "8"
mime_guess = "2"

[dev-dependencies]
http-body-util = { workspace = true }
tokio-tungstenite = "0.24"
