[package]
name = "seaquel-engine-duckdb"
version = "0.1.0"
edition = "2021"
description = "DuckDB engine for Seaquel: the DuckDB helper's two halves (the client and the helper's loop) and, for the browser demo, a driver over DuckDB-WASM."

[features]
# The helper's client: every native interface reaches DuckDB this way, so
# `cargo test -p seaquel-engine-duckdb` runs every suite through the helper
# with no DuckDB in the test binaries. (There is no in-process native
# driver any more.)
default = ["remote"]
# The browser demo (phase 8): DuckDB-WASM through a JavaScript bridge the page
# passes in. Its driver is compiled only for wasm32 (`src/browser/`); the
# literal binds and the IPC reader are pure and also run in native tests.
browser = [
    "dep:arrow-buffer",
    "dep:arrow-ipc",
    "dep:futures",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]
# The DuckDB helper: `remote` is the client half, a
# `Driver` over a `seaquel-duckdb` child process, with no `duckdb` crate;
# `helper` is the server half the helper binary runs: duckdb-rs, the session
# code (`session.rs`), the interrupt guard (`blocking.rs`) and the column
# kinds (`kinds.rs`). Both share the frames (`wire.rs`); the client reads
# the IPC (`ipc.rs`) the helper writes.
# The helper's loop is `helper.rs` (`serve`, run by `crates/seaquel-duckdb`);
# the remote driver is `remote/` (`remote_engine`). Native only: it spawns
# a process.
remote = [
    "dep:arrow-buffer",
    "dep:arrow-ipc",
    "dep:libc",
    "dep:serde",
    "dep:tokio",
    "tokio/io-util",
    "tokio/macros",
    "tokio/process",
    "tokio/sync",
    "tokio/time",
    # Windows: every start reads the helper's and its folders' DACLs
    # (`process::check`).
    "seaquel-runtime/acl",
]
# `tokio/time`: the end's wait for DuckDB's close is measured on tokio's
# clock (std's `Instant` is kept out of the engine crates).
helper = ["dep:duckdb", "dep:tokio", "dep:arrow-buffer", "dep:arrow-ipc", "dep:serde", "tokio/time"]

[dependencies]
seaquel-engine = { path = "../seaquel-engine" }
seaquel-runtime = { path = "../seaquel-runtime" }
seaquel-types = { path = "../seaquel-types" }
# `explain_read_only` counts statements with its splitter; the browser driver
# writes its bound values with `params::duckdb_bind_literal` and finds the
# placeholders with its scanner.
seaquel-sql = { path = "../seaquel-sql" }
async-stream = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
# The decoder reads arrow-rs arrays. The version is the one duckdb-rs
# re-exports (`duckdb::arrow`, 58.4), so the helper writes the same types
# the clients read back from `arrow-ipc`.
arrow-array = "58.4"
arrow-schema = "58.4"

# helper: DuckDB itself.
duckdb = { workspace = true, optional = true }
# remote and helper.
tokio = { workspace = true, features = ["rt"], optional = true }

# browser, remote and helper (the helper writes IPC, the others read it)
arrow-buffer = { version = "58.4", optional = true }
arrow-ipc = { version = "58.4", default-features = false, optional = true }
futures = { workspace = true, optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

# remote and helper: the control messages (`wire.rs`)
serde = { workspace = true, optional = true }

# remote: `geteuid` for the check of the helper's folders (Unix).
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
serde = { workspace = true }
seaquel-engine-testkit = { path = "../seaquel-engine-testkit" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["io-util", "macros", "rt", "time"] }
futures = { workspace = true }
# `decode_from_ipc_matches_the_reference`: DuckDB's Arrow written as IPC and
# read back the way the browser driver reads DuckDB-WASM's; and the
# client's decode of a column it can't read.
arrow-buffer = "58.4"
arrow-ipc = { version = "58.4", default-features = false }
# tests/remote.rs installs the built helper into folders of its own.
tempfile = "3"
