[package]
name = "seaquel-cli"
version = "0.1.0"
edition = "2021"
description = "The `seaquel-cli` binary bundled with the desktop app. Its one subcommand, `mcp`, serves Seaquel's MCP server over stdio."

[[bin]]
name = "seaquel-cli"
path = "src/main.rs"

[dependencies]
# The five engines (Core's defaults) and the infrastructure the MCP server
# needs. No `git` and no `license-*`: the CLI doesn't check licenses
# (decision 14 of the design doc).
seaquel-core = { path = "../seaquel-core", features = ["storage", "secrets", "ssh", "workspace"] }
seaquel-mcp = { path = "../seaquel-mcp" }
clap = { workspace = true }
rmcp = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "signal"] }
# Logs, rmcp's `tracing` events and Core's `log` records alike, go to stderr
# only: stdout carries the MCP protocol.
tracing-subscriber = { workspace = true }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
seaquel-types = { path = "../seaquel-types" }
sqlx = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["process", "io-util", "time"] }
