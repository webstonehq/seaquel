[package]
name = "seaquel-terminal"
version = "0.1.0"
edition = "2021"
description = "What the terminal binaries (`seaquel-cli`, `seaquel-tui`) share: the data dir, their Core builder, the debug-only test hooks, the log filter, the shutdown signals and the version and terms line."

[dependencies]
# The union of what both binaries need through this crate. `imports` (the
# CLI) and `ai-native` (the TUI) stay on each binary's own `seaquel-core`
# dependency, so neither links the other's extras (Decision 22). Core's
# default features are every engine.
seaquel-core = { path = "../seaquel-core", features = ["storage", "secrets", "ssh", "workspace"] }
# `TokioExecutor`, Core's clock.
seaquel-runtime = { path = "../seaquel-runtime", features = ["tokio"] }
clap = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["signal", "macros"] }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
# The log filter's marker test emits events at russh's targets (already in
# Cargo.lock through tracing-subscriber).
tracing = "0.1"
