[package]
name = "seaquel-http"
version = "0.1.0"
edition = "2021"
description = "Seaquel's outbound HTTP (native only): the reqwest client that never panics on a broken certificate store (licensing and model calls), the streaming client behind seaquel-ai's HttpClient, and the web server's egress guard."

[features]
# The OS proxy settings (macOS/Windows system config). The desktop turns it
# on, as seaquel-license's `desktop` feature does for its own client.
system-proxy = ["reqwest/system-proxy"]
# Downloading and installing a release asset (the DuckDB helper plan, Task
# 4): the release metadata, the download checked for size and SHA-256,
# gzip, and the install into private folders. Core's
# `duckdb-helper-install` turns it on; the web server doesn't.
# On Windows the folders and the file get a protected DACL of the user and
# SYSTEM (`seaquel-runtime/acl`; the desktop DuckDB helper plan, Task 7).
release-asset = [
    "dep:flate2",
    "dep:libc",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tempfile",
    "seaquel-runtime/acl",
]
# A release server on 127.0.0.1 for tests (`release_asset::testing`), here
# and in the crates that install through Core.
testing = ["release-asset", "tokio/rt", "tokio/net", "tokio/io-util", "tokio/sync"]

[dependencies]
seaquel-ai = { path = "../seaquel-ai" }
seaquel-runtime = { path = "../seaquel-runtime" }
futures = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["time"] }
# Already in the tree through reqwest; named for `Host` (the parsed host).
url = "2"

# release-asset
flate2 = { version = "1", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }

# release-asset: `O_NOFOLLOW`/`O_DIRECTORY` and `geteuid` for the install
# folders (Unix).
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
seaquel-http = { path = ".", features = ["release-asset", "testing"] }
seaquel-ai = { path = "../seaquel-ai", features = ["testing"] }
serde_json = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
