[package]
name = "seaquel-mcp"
version = "0.1.0"
edition = "2021"
description = "Seaquel's MCP server: the rmcp ServerHandler and tool set behind `seaquel-cli mcp`."

[dependencies]
# `join_all`: the server closes its connections at once on exit.
futures = { workspace = true }
# `ai`: the tool registry (arguments, schemas, renderers and the runner,
# `ai::tools::call`) and the sharing rule (phase 6). Not `ai-native`: the
# server makes no model calls. No default features (every engine, with
# native DuckDB): the server registers no engine; `seaquel-cli` builds its
# Core through seaquel-terminal, with DuckDB in the helper.
# `engine-duckdb-remote` (no DuckDB linked) for `Core::duckdb_helper_status`,
# which words a missing helper's tool error.
seaquel-core = { path = "../seaquel-core", default-features = false, features = ["storage", "secrets", "ssh", "workspace", "ai", "engine-duckdb-remote"] }
seaquel-types = { path = "../seaquel-types" }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "io-util", "io-std"] }

[dev-dependencies]
# tests/tools.rs runs its DuckDB cases through the helper
# (`engine-duckdb-remote`, `CoreBuilder::duckdb_helper`), with the other
# engines the cases use.
seaquel-core = { path = "../seaquel-core", features = [
    "engine-postgres",
    "engine-mysql",
    "engine-sqlite",
    "engine-mssql",
    "engine-duckdb-remote",
] }
# `#[seaquel_runtime::async_trait]`, for the tests' `SecretStore`s; `acl`
# makes the DuckDB helper's folder private on Windows.
seaquel-runtime = { path = "../seaquel-runtime", features = ["acl"] }
# The in-process client over `tokio::io::duplex` (tests/tools.rs). The
# child-process client is in seaquel-cli's tests/stdio.rs, which owns the
# binary.
rmcp = { workspace = true, features = ["client"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "time"] }
