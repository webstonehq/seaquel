[package]
name = "seaquel-types"
version = "0.1.0"
edition = "2021"
description = "Wire types shared by every Seaquel interface. Build with --features ts to regenerate the TypeScript bindings."

[features]
# Generates src/lib/types/generated/*.ts when running `cargo test --features ts`.
# Run it through `npm run types:gen`.
ts = ["dep:ts-rs"]

[dependencies]
serde = { workspace = true }
# raw_value: storage row types keep JSON columns as the text that came in.
serde_json = { workspace = true, features = ["raw_value"] }
base64 = { workspace = true }
# `names::name_key` (phase 5d): NFC and full Unicode case folding. Both
# are pure Rust with no dependencies of their own, and build for wasm32.
unicode-normalization = "0.1.25"
unicase = "2.9"
ts-rs = { workspace = true, optional = true }
