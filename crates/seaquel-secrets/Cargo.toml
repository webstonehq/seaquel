[package]
name = "seaquel-secrets"
version = "0.1.0"
edition = "2021"
description = "Seaquel secret storage: the SecretStore trait and the OS keychain store for connection passwords, SSH keys and API keys."

[dependencies]
seaquel-runtime = { path = "../seaquel-runtime" }
keyring = { workspace = true }
thiserror = { workspace = true }
# `rt`: the keychain's blocking calls. `sync`: `SecretWait::changed`'s
# watch channel.
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
uuid = { workspace = true }
