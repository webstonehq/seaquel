[package]
name = "seaquel-ssh"
version = "0.1.0"
edition = "2021"
description = "Seaquel SSH tunnels: local port forwards through a bastion with host-key checking and trust on first use."

[dependencies]
seaquel-types = { path = "../seaquel-types" }
async-trait = { workspace = true }
log = { workspace = true }
russh = { workspace = true }
russh-keys = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "rt", "sync"] }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
