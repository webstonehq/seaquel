[package]
name = "seaquel-core"
version = "0.1.0"
edition = "2021"
description = "Seaquel Core: registers plugins and owns connections and running queries. Every interface goes through it."

[features]
default = ["engine-postgres", "engine-mysql", "engine-sqlite", "engine-mssql", "engine-duckdb"]
engine-postgres = ["dep:seaquel-engine-postgres"]
engine-mysql = ["dep:seaquel-engine-mysql"]
engine-sqlite = ["dep:seaquel-engine-sqlite"]
engine-mssql = ["dep:seaquel-engine-mssql"]
engine-duckdb = ["dep:seaquel-engine-duckdb"]
# Infrastructure (phase 3), off by default. src-tauri will enable storage,
# secrets, ssh, git and license-desktop; seaquel-server storage and
# license-server; the browser build none of them.
storage = ["dep:seaquel-storage"]
secrets = ["dep:seaquel-secrets"]
ssh = ["dep:seaquel-ssh"]
git = ["dep:seaquel-git"]
license-desktop = ["dep:seaquel-license", "seaquel-license/desktop"]
license-server = ["dep:seaquel-license", "seaquel-license/server"]
# `Workspace::connect`/`test` and the editor's runs (`Workspace::run`/`page`).
# seaquel-cli enables it with storage, secrets and ssh. The domain crate
# itself (`seaquel_core::domain`) is always there: it is pure, builds for
# wasm32, and its run types are on the `db` wire in every build.
workspace = []
# The TypeScript bindings of the domain's wire types (`seaquel-rpc/ts`).
ts = ["seaquel-workspace/ts"]
# The wasm32 build for the browser (phase 8's Core in the web page): no
# engines and no infrastructure, only what builds for wasm32-unknown-unknown.
# CI checks it with --no-default-features --features seaquel-core/browser.
browser = []

[dependencies]
seaquel-engine = { path = "../seaquel-engine" }
seaquel-runtime = { path = "../seaquel-runtime" }
seaquel-sql = { path = "../seaquel-sql" }
seaquel-types = { path = "../seaquel-types" }
seaquel-engine-postgres = { path = "../seaquel-engine-postgres", optional = true }
seaquel-engine-mysql = { path = "../seaquel-engine-mysql", optional = true }
seaquel-engine-sqlite = { path = "../seaquel-engine-sqlite", optional = true }
seaquel-engine-mssql = { path = "../seaquel-engine-mssql", optional = true }
seaquel-engine-duckdb = { path = "../seaquel-engine-duckdb", optional = true }
seaquel-storage = { path = "../seaquel-storage", optional = true }
seaquel-secrets = { path = "../seaquel-secrets", optional = true }
seaquel-ssh = { path = "../seaquel-ssh", optional = true }
seaquel-git = { path = "../seaquel-git", optional = true }
seaquel-license = { path = "../seaquel-license", optional = true }
seaquel-workspace = { path = "../seaquel-workspace" }
async-stream = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# Connection ids are v4 UUIDs; in the browser their randomness comes from
# crypto.getRandomValues.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
# Turns on the workspace features for this crate's own tests
# (tests/workspace.rs, tests/connect.rs), so `cargo test -p seaquel-core`
# runs them.
seaquel-core = { path = ".", default-features = false, features = ["storage", "secrets", "ssh", "workspace"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
# `TokioExecutor` for tests/run_live.rs.
seaquel-runtime = { path = "../seaquel-runtime", features = ["tokio"] }
# Seeding and reading the metadata file with plain SQL (tests/library.rs,
# tests/string_secrets.rs), as the library fixtures' replay rules ask.
sqlx = { workspace = true }
serde = { workspace = true }
