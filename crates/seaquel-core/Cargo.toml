[package]
name = "seaquel-core"
version = "0.1.0"
edition = "2021"
description = "Seaquel Core: registers plugins and owns connections and running queries. Every interface goes through it."

[features]
default = ["engine-postgres", "engine-mysql", "engine-sqlite", "engine-mssql", "engine-duckdb"]
engine-postgres = ["dep:seaquel-engine-postgres"]
engine-mysql = ["dep:seaquel-engine-mysql"]
engine-sqlite = ["dep:seaquel-engine-sqlite"]
engine-mssql = ["dep:seaquel-engine-mssql"]
# The native DuckDB driver (duckdb-rs, in process): the desktop app.
engine-duckdb = ["dep:seaquel-engine-duckdb", "seaquel-engine-duckdb/native"]
# DuckDB in a helper process (the DuckDB helper plan): the terminal
# binaries, through `CoreBuilder::duckdb_helper`. No `duckdb` crate in the
# build. Refused with `browser`.
engine-duckdb-remote = ["dep:seaquel-engine-duckdb", "seaquel-engine-duckdb/remote"]
# Downloading the helper (the DuckDB helper plan, Task 4):
# `Core::duckdb_helper_asset`, `duckdb_helper_install` and
# `duckdb_helper_install_from_file`, over `seaquel-http`'s `release_asset`.
# `Core::duckdb_helper_status` needs only `engine-duckdb-remote`.
duckdb-helper-install = ["engine-duckdb-remote", "dep:seaquel-http", "seaquel-http/release-asset", "dep:tokio"]
# `CoreBuilder::duckdb_helper_releases` (another release source) in a
# build without debug assertions: tests only (review I1). Debug builds have
# it anyway, for the terminal binaries' test hooks.
duckdb-helper-testing = ["duckdb-helper-install", "seaquel-http/testing"]
# Infrastructure (phase 3), off by default. src-tauri will enable storage,
# secrets, ssh, git and license-desktop; seaquel-server storage and
# license-server; the browser build none of them.
storage = ["dep:seaquel-storage"]
secrets = ["dep:seaquel-secrets"]
ssh = ["dep:seaquel-ssh"]
git = ["dep:seaquel-git"]
# Phase 5e: reading TablePlus's and DBeaver's connection files
# (`Workspace::import_candidates`, `import_create`). src-tauri and
# seaquel-cli enable it; seaquel-server doesn't.
imports = ["storage", "dep:plist", "dep:dirs", "dep:tokio"]
license-desktop = ["dep:seaquel-license", "seaquel-license/desktop"]
license-server = ["dep:seaquel-license", "seaquel-license/server"]
# `Workspace::connect`/`test` and the editor's runs (`Workspace::run`/`page`).
# seaquel-terminal enables it with storage, secrets and ssh for both
# terminal binaries (seaquel-cli and seaquel-tui). The domain crate
# itself (`seaquel_core::domain`) is always there: it is pure, builds for
# wasm32, and its run types are on the `db` wire in every build.
workspace = []
# Phase 6: the AI domain and the assistant's turn (`seaquel_core::ai`):
# `Workspace::ai_chat`, `ai_respond`, `ai_generate`, `ai_models`,
# `ai_test`, and the tool registry Core runs. It needs an `HttpClient`
# (`CoreBuilder::ai_http`) and an egress policy (`ai_egress`), with no
# default for either. seaquel-mcp enables it for the registry only;
# seaquel-browser enables it with its own fetch bridge.
ai = ["workspace", "storage", "dep:seaquel-ai"]
# The native HTTP client (`seaquel-http`'s reqwest client and the egress
# guard), re-exported as `seaquel_core::ai::native`. src-tauri,
# seaquel-server and seaquel-tui enable it (seaquel-cli doesn't: it calls no
# model); it is refused with `browser`.
ai-native = ["ai", "dep:seaquel-http"]
# The OS proxy settings (macOS/Windows system config) for the native model
# client. The desktop turns it on, as `license-desktop` does for its own.
ai-system-proxy = ["ai-native", "seaquel-http/system-proxy"]
# The TypeScript bindings of the domain's wire types (`seaquel-rpc/ts`).
ts = ["seaquel-workspace/ts"]
# The wasm32 build for the browser (phase 8's Core in the web page). It
# admits `storage` (the metadata file in memory) and `workspace`, and refuses
# every engine (`engine-duckdb` is the native driver; the page's module
# registers the browser driver itself) and the other infrastructure
# features, `imports` included (a `compile_error!` in lib.rs). It also turns
# on `Workspace::ensure_demo_connection`. CI checks it with
# --no-default-features --features seaquel-core/browser,seaquel-core/storage,
# seaquel-core/workspace.
browser = []

[dependencies]
seaquel-engine = { path = "../seaquel-engine" }
seaquel-runtime = { path = "../seaquel-runtime" }
seaquel-sql = { path = "../seaquel-sql" }
seaquel-types = { path = "../seaquel-types" }
seaquel-engine-postgres = { path = "../seaquel-engine-postgres", optional = true }
seaquel-engine-mysql = { path = "../seaquel-engine-mysql", optional = true }
seaquel-engine-sqlite = { path = "../seaquel-engine-sqlite", optional = true }
seaquel-engine-mssql = { path = "../seaquel-engine-mssql", optional = true }
seaquel-engine-duckdb = { path = "../seaquel-engine-duckdb", default-features = false, optional = true }
seaquel-storage = { path = "../seaquel-storage", optional = true }
seaquel-secrets = { path = "../seaquel-secrets", optional = true }
seaquel-ssh = { path = "../seaquel-ssh", optional = true }
seaquel-git = { path = "../seaquel-git", optional = true }
seaquel-license = { path = "../seaquel-license", optional = true }
seaquel-workspace = { path = "../seaquel-workspace" }
seaquel-ai = { path = "../seaquel-ai", optional = true }
seaquel-http = { path = "../seaquel-http", optional = true }
async-stream = { workspace = true }
dirs = { workspace = true, optional = true }
# `imports` reads and decodes the other tool's file on a blocking thread
# (native only; the feature never builds for wasm32).
tokio = { version = "1", features = ["rt"], optional = true }
# The event stream (`plist::stream`) bounds a TablePlus plist's nesting and
# size before it is built; it sits behind this feature, so the version is
# pinned to the minor release it was written against.
plist = { version = "~1.10.1", optional = true, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
futures = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# Connection ids are v4 UUIDs; in the browser their randomness comes from
# crypto.getRandomValues.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
# Turns on the workspace features for this crate's own tests
# (tests/workspace.rs, tests/connect.rs), so `cargo test -p seaquel-core`
# runs them.
# `engine-duckdb-remote` for tests/duckdb_remote.rs (skipped unless
# SEAQUEL_TEST_DUCKDB_HELPER names a built helper).
# `duckdb-helper-install` for tests/duckdb_helper_install.rs, against
# seaquel-http's loopback release server (`testing`).
seaquel-core = { path = ".", default-features = false, features = ["storage", "secrets", "ssh", "workspace", "git", "imports", "engine-duckdb-remote", "duckdb-helper-install", "duckdb-helper-testing"] }
seaquel-http = { path = "../seaquel-http", features = ["testing"] }
# tests/shared.rs: points libgit2's config search paths at an empty dir, so
# no test reads the user's git config.
git2 = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
# `TokioExecutor` for tests/run_live.rs.
seaquel-runtime = { path = "../seaquel-runtime", features = ["tokio"] }
# Seeding and reading the metadata file with plain SQL (tests/library.rs,
# tests/string_secrets.rs), as the library fixtures' replay rules ask.
sqlx = { workspace = true }
serde = { workspace = true }
# The mock provider and the loopback-only client (tests/ai_*.rs, phase 6):
# no test reaches a real model provider.
seaquel-ai = { path = "../seaquel-ai", features = ["testing"] }
