[package]
name = "seaquel-workspace"
version = "0.1.0"
edition = "2021"
description = "Seaquel workspace domain: turns a saved connection and its secrets into a ConnectConfig, plans the editor's runs, and later holds the services behind every interface."

[features]
# Generates the run types into src/lib/types/generated/ when running
# `cargo test --features ts`. Run it through `npm run types:gen`.
ts = ["dep:ts-rs", "seaquel-types/ts", "seaquel-sql/ts"]

[dependencies]
seaquel-types = { path = "../seaquel-types" }
# `run::plan`: splitting, the statement at the cursor, `{{param}}`
# substitution and the statement checks.
seaquel-sql = { path = "../seaquel-sql" }
# `max_query_rows()`, the cap on a run's page size.
seaquel-engine = { path = "../seaquel-engine" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
# History timestamps, formatted like `Date.toISOString()`.
time = { workspace = true }
# The WHATWG URL parser, as the TypeScript's `new URL` (password
# reinjection, the SSH host and port rewrite, the URL-username fallback).
url = "2"
percent-encoding = "2"
ts-rs = { workspace = true, optional = true }
# `imports`: JavaScript's `String(n)` for the numbers TablePlus and DBeaver
# hand over where the TypeScript took text.
ryu-js = { workspace = true }
# `shared`: the content hash (Decision 34), the file names' NFC and
# general categories (Q21). All three are pure and build for wasm32.
sha2 = "0.10"
unicode-normalization = "0.1.25"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

[dev-dependencies]
futures = { workspace = true }
# tests/edits_plan.rs replays the edit fixtures with each engine's real
# dialect (dev-dependencies are exempt from the crate rules).
seaquel-engine-postgres = { path = "../seaquel-engine-postgres" }
seaquel-engine-mysql = { path = "../seaquel-engine-mysql" }
seaquel-engine-sqlite = { path = "../seaquel-engine-sqlite" }
seaquel-engine-mssql = { path = "../seaquel-engine-mssql" }
seaquel-engine-duckdb = { path = "../seaquel-engine-duckdb" }
# tests/imports_plan.rs decodes the TablePlus XML plists, as Core does.
plist = "1"
