[package]
name = "seaquel-git"
version = "0.1.0"
edition = "2021"
description = "Seaquel git operations for shared projects: clone, pull, push, status, commit and conflict resolution over libgit2."

[dependencies]
seaquel-types = { path = "../seaquel-types" }
# `tree`: the shared projection's file operations and scan types, and the
# hash a write's `expect_hash` is checked against (phase 5e).
seaquel-workspace = { path = "../seaquel-workspace" }
dirs = { workspace = true }
git2 = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt"] }

# `tree` opens files with `O_NOFOLLOW`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
