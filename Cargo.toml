[workspace]
members = [
    "crates/seaquel-macros",
    "crates/seaquel-runtime",
    "crates/seaquel-types",
    "crates/seaquel-engine",
    "crates/seaquel-engine-testkit",
    "crates/seaquel-engine-sqlite",
    "crates/seaquel-engine-postgres",
    "crates/seaquel-engine-mysql",
    "crates/seaquel-engine-mssql",
    "crates/seaquel-engine-duckdb",
    "crates/seaquel-core",
    "crates/seaquel-rpc",
    "crates/seaquel-sql",
    "crates/seaquel-wasm",
    "crates/seaquel-browser",
    "crates/seaquel-server",
    "crates/seaquel-storage",
    "crates/seaquel-secrets",
    "crates/seaquel-ssh",
    "crates/seaquel-git",
    "crates/seaquel-license",
    "crates/seaquel-http",
    "crates/seaquel-ai",
    "crates/seaquel-workspace",
    "crates/seaquel-mcp",
    "crates/seaquel-terminal",
    "crates/seaquel-cli",
    "crates/seaquel-tui",
    "src-tauri",
]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: every float parses back to the bits it was written
# from. The default parser can be one ULP off near the top of the range
# (phase 8 Task 5: FLOAT's maximum, read and bound back, didn't equal
# itself). Cargo unifies the feature into every build that has serde_json.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
log = { version = "0.4", features = ["kv"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ts-rs = "12"

# seaquel-sql / seaquel-wasm (phase 2b). sqlparser's default features
# (recursive-protection) made no size difference in the spike; its own
# recursion limit still applies.
sqlparser = { version = "0.63", default-features = false, features = ["std"] }
ryu-js = "1"
# Exact pin: the version Cargo.lock already had through chrono. It also has to
# match the wasm-bindgen-cli that builds the module (scripts/build-wasm.mjs).
wasm-bindgen = "=0.2.128"

sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "json", "time", "rust_decimal", "ipnetwork", "mac_address", "bit-vec"] }
tiberius = { version = "0.12", default-features = false, features = ["tokio", "chrono", "tds73", "rustls"] }
# `json` links DuckDB's json extension in statically, so the MCP server's
# restricted instance (no autoinstall or autoload) has `json_extract` and
# friends. `icu` (time zones, TIMESTAMPTZ arithmetic) can't be linked from
# the crates.io package: it needs `bundled-cmake`, which panics without the
# `duckdb-sources` checkout the package excludes.
duckdb = { version = "1.1", features = ["bundled", "json"] }
rust_decimal = "1"
time = { version = "0.3", features = ["formatting"] }

# Infrastructure crates (phase 3). Native only; Core pulls them in behind features.
# Exact pin and features: what tauri-plugin-keyring 0.1.0 resolved to, so the
# entries it saved read back unchanged.
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
russh = "0.48"
russh-keys = "0.48"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
# rustls, like sqlx and tiberius, so seaquel-server's image gets no OpenSSL.
# With both root features, reqwest 0.12 puts the bundled webpki roots and the OS
# trust store into one root store (async_impl/client.rs): desktop keeps trusting
# a corporate proxy's CA from the OS, as it did through native-tls, and a server
# image without a system CA bundle still has the webpki roots (an empty native
# store isn't an error).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
ed25519-dalek = "2"
dirs = "6"

# Server-side only
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
http-body-util = "0.1"

# The MCP server and the CLI (phase 4). rmcp 3.4.1 was the current release on
# crates.io when phase 4 began; seaquel-mcp's tests add `client` and
# `transport-child-process`.
rmcp = { version = "3.4.1", default-features = false, features = ["server", "macros", "transport-io"] }
clap = { version = "4", features = ["derive"] }
schemars = "1"
# The CLI's stderr logging: `fmt` for the output, `tracing-log` so `log`
# records (Core, sqlx) reach it, and the `Targets` filter (`registry` + `std`).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "tracing-log"] }

# The TUI (phase 7a, S1). ratatui 0.30's crossterm backend is crossterm
# 0.29, which ratatui-textarea's `ratatui-crossterm` also takes; `crossterm`
# itself is named for `event-stream` (the event loop's `EventStream`).
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-textarea = "0.9.2"
unicode-width = "0.2"

# Debug and test builds keep line tables only (backtraces still show file
# and line), and dependencies carry no debug info. Full debug info made each
# test binary about 200 MB, which slowed linking and, on macOS, the code
# signature check every freshly built binary and proc-macro dylib goes
# through. For a debugger session, override locally with
# CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The WebAssembly module (seaquel-wasm):
#   cargo build --profile wasm-release --target wasm32-unknown-unknown -p seaquel-wasm
# Kept out of [profile.release] so seaquel-server and the desktop app aren't
# built for size.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The standalone terminal binaries (seaquel-cli, seaquel-tui), as released:
#   node scripts/build-cli.mjs --release [--bin seaquel-tui]
# Fat LTO and one codegen unit drop about a quarter of their size (DuckDB is
# most of what's left) at no measurable runtime cost, for about a minute more
# per clean build. Kept out of [profile.release] for the same reason as above.
# It keeps release's `panic = "unwind"`: the TUI's panic hook restores the
# terminal, and the engines catch panics with `catch_unwind` (DuckDB's
# blocking pool and decoder) so one becomes an error, not an exit.
[profile.terminal-release]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
