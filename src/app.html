<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explore, query, and visualize your databases — all in one app.</title>
    <script>
      // Prevent flash of wrong theme/direction on initial load
      (function () {
        var root = document.documentElement;
        // Blocked site data (Firefox with storage off, some private modes)
        // makes `localStorage` and `sessionStorage` throw on access, and
        // libraries read them unguarded at startup (paraglide's locale,
        // mode-watcher, persisted state). Such a page gets an in-memory
        // Storage instead: nothing is kept anyway, and the demo says so
        // (its IndexedDB fails the same way: "nothing is kept").
        function memoryStorage() {
          var items = new Map();
          return {
            get length() {
              return items.size;
            },
            key: function (i) {
              var keys = Array.from(items.keys());
              return i < keys.length ? keys[i] : null;
            },
            getItem: function (k) {
              return items.has(String(k)) ? items.get(String(k)) : null;
            },
            setItem: function (k, v) {
              items.set(String(k), String(v));
            },
            removeItem: function (k) {
              items.delete(String(k));
            },
            clear: function () {
              items.clear();
            },
          };
        }
        ["localStorage", "sessionStorage"].forEach(function (name) {
          try {
            void window[name];
          } catch (e) {
            try {
              Object.defineProperty(window, name, {
                value: memoryStorage(),
                configurable: true,
              });
            } catch (e2) {
              // Left as it is; `read` below still copes.
            }
          }
        });
        function read(key) {
          try {
            return window.localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }

        // Handle RTL direction from persisted locale
        var locale = read("PARAGLIDE_LOCALE");
        if (locale) {
          root.lang = locale;
          if (["ar", "he", "fa", "ur"].indexOf(locale) !== -1) {
            root.dir = "rtl";
          }
        }

        // Handle dark mode
        var mode = read("mode-watcher-mode");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark =
          mode === "dark" || (mode === "system" && prefersDark) || (!mode && prefersDark);
        if (isDark) {
          root.classList.add("dark");
          root.style.colorScheme = "dark";
        }

        // Apply cached theme colors
        try {
          var cached = read("seaquel-theme-cache");
          if (cached) {
            var theme = JSON.parse(cached);
            if (theme.colors) {
              // Map of property names to CSS variable names
              var varMap = {
                background: "--background",
                foreground: "--foreground",
                card: "--card",
                cardForeground: "--card-foreground",
                popover: "--popover",
                popoverForeground: "--popover-foreground",
                primary: "--primary",
                primaryForeground: "--primary-foreground",
                secondary: "--secondary",
                secondaryForeground: "--secondary-foreground",
                muted: "--muted",
                mutedForeground: "--muted-foreground",
                accent: "--accent",
                accentForeground: "--accent-foreground",
                destructive: "--destructive",
                border: "--border",
                input: "--input",
                ring: "--ring",
                chart1: "--chart-1",
                chart2: "--chart-2",
                chart3: "--chart-3",
                chart4: "--chart-4",
                chart5: "--chart-5",
                sidebar: "--sidebar",
                sidebarForeground: "--sidebar-foreground",
                sidebarPrimary: "--sidebar-primary",
                sidebarPrimaryForeground: "--sidebar-primary-foreground",
                sidebarAccent: "--sidebar-accent",
                sidebarAccentForeground: "--sidebar-accent-foreground",
                sidebarBorder: "--sidebar-border",
                sidebarRing: "--sidebar-ring",
              };

              for (var key in varMap) {
                if (theme.colors[key]) {
                  root.style.setProperty(varMap[key], theme.colors[key]);
                }
              }
            }
          }
        } catch (e) {
          // Ignore cache errors
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
